name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0，留空则从 tag 读取）'
        required: false
        default: ''

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (arm64 + x86_64)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          RESP=$(curl -sS \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -d "{\"tag_name\":\"$TAG\"}")
          BODY=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('body',''))")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build universal macOS app
        run: npx tauri build --target universal-apple-darwin --bundles app dmg

      - name: Package .pkg with postinstall (auto clear quarantine)
        id: pkg
        env:
          APP_PATH: src-tauri/target/universal-apple-darwin/release/bundle/macos/MindTide.app
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/MindTide.app"
          WS="/tmp/pkg"
          rm -rf "$WS" && mkdir -p "$WS/payload/Applications" "$WS/scripts"
          cp -R "$APP_PATH" "$WS/payload/Applications/"
          codesign --force --deep -s - "$WS/payload/Applications/MindTide.app"
          cat > "$WS/scripts/postinstall" <<'EOF'
          #!/bin/bash
          set -e
          /usr/bin/xattr -cr "/Applications/MindTide.app" || true
          exit 0
          EOF
          chmod +x "$WS/scripts/postinstall"
          VERSION="${VERSION#v}"
          pkgbuild \
            --install-location / \
            --root "$WS/payload" \
            --scripts "$WS/scripts" \
            --identifier com.mindtide.app \
            --version "$VERSION" \
            --ownership recommended \
            "$WS/MindTide-$VERSION-universal.pkg"
          DIST="/tmp/pkgdist"
          rm -rf "$DIST" && mkdir -p "$DIST"
          cp "$WS/MindTide-$VERSION-universal.pkg" "$DIST/"
          cp -R "$APP_PATH" "$DIST/"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$DIST/"
          echo "pkg_path=$DIST" >> "$GITHUB_OUTPUT"

      - name: Upload macOS assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          prerelease: false
          body: |
            构建产物见附件。macOS 安装 `.pkg`，安装时已自动清理隔离属性，装完可直接双击打开（同时支持 Apple Silicon 与 Intel Mac）。

            ## 更新日志

            ${{ steps.notes.outputs.notes }}
          files: |
            /tmp/pkgdist/MindTide-*.pkg
            /tmp/pkgdist/MindTide.app
            /tmp/pkgdist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          RESP=$(curl -sS \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -d "{\"tag_name\":\"$TAG\"}")
          BODY=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('body',''))")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'MindTide v__VERSION__'
          releaseBody: |
            构建产物见附件。

            ## 更新日志

            ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
