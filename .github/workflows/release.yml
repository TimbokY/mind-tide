name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0，留空则从 tag 读取）'
        required: false
        default: ''

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          RESP=$(curl -sS \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -d "{\"tag_name\":\"$TAG\"}")
          BODY=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('body',''))")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'MindTide v__VERSION__'
          releaseBody: |
            构建产物见附件。macOS 用户首次打开时若提示不受信任，请右键点击 App → 打开，或执行 `xattr -cr /Applications/MindTide.app`。windows 用户使用管理员身份安装。

            ## 更新日志

            ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: --bundles dmg app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          RESP=$(curl -sS \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -d "{\"tag_name\":\"$TAG\"}")
          BODY=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('body',''))")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'MindTide v__VERSION__'
          releaseBody: |
            构建产物见附件。

            ## 更新日志

            ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
